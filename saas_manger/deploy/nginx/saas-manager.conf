# =============================================================================
# SaaS Manager — nginx reverse proxy
#
# Template: deploy/setup-server.sh substitutes __APP_DIR__ and __SERVER_NAME__
# and installs the result as /etc/nginx/sites-available/saas-manager.conf.
#
# Terminates plain HTTP on :80 and forwards to uvicorn on 127.0.0.1:8080. Add
# TLS with certbot (`sudo certbot --nginx -d your.domain`) after pointing DNS at
# the instance; that rewrites this block to listen on :443.
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Allow larger JSON/CSV uploads without 413s.
    client_max_body_size 25m;

    access_log /var/log/nginx/saas-manager.access.log;
    error_log  /var/log/nginx/saas-manager.error.log;

    # Static assets straight from disk (the app also serves them, this is faster).
    location /static/ {
        alias __APP_DIR__/app/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Odoo provision/backup calls can be slow; keep generous timeouts.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
