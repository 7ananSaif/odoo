[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".git", "__pycache__", "venv", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "PLC", # Pylint convention
]
ignore = [
    "E501",    # Line too long
    "B008",    # Do not perform function call in argument defaults
    "PLC0415", # Import outside top level
    "UP031",   # Use format specifiers instead of percent format
    "ISC001",  # Prevents conflicts with `ruff format`
]

[tool.ruff.lint.per-file-ignores]
"__manifest__.py" = ["B018"]    # Manifest dictionary is an implicit expression
"__init__.py" = ["F401"]        # Unused imports in package initializers
"**/tests/*" = ["B018", "B017"]

[tool.ruff.lint.isort]
known-first-party = ["app", "odoo", "odoo.addons"]

# ==========================================
# Mypy Config
# ==========================================
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "prometheus_fastapi_instrumentator",
    "prometheus_fastapi_instrumentator.*",
]
ignore_missing_imports = true
