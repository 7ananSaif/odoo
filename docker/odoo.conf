[options]
; ---------------------------------------------------------------------------
; Public, tenant-facing instance — database management is DISABLED.
; ---------------------------------------------------------------------------
; list_db = False removes the database selector and the "Manage Databases"
; link from the public login page and blocks every web database operation
; (list, create, duplicate, drop, backup, restore, rename, master-password
; change) at the Odoo service layer (odoo/service/db.py). This file is mounted
; read-only at /etc/odoo/odoo.conf for the public `odoo` compose service.
;
; The owner manages databases with the separate, admin-only `odoo-master`
; instance (docker compose --profile saas-master up -d odoo-master) or with
; the `odoo db` CLI (see docs/db-management-owner-runbook.md).
;
; db_host / db_port / db_user / db_password are intentionally NOT set here:
; the image entrypoint injects them from the HOST/PORT/USER/PASSWORD env vars
; in .env, so no database credentials are committed to the repository.
addons_path = /opt/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
http_interface = 0.0.0.0
http_port = 8069
proxy_mode = True
; admin_passwd is irrelevant while list_db = False (no database management is
; reachable, so there is nothing to unlock). Set a long random value here only
; if you ever re-enable list_db on this public instance.
list_db = False
; Optional single-database pin — uncomment and set your database name, or use
; ^%d$ for a one-subdomain-per-client SaaS (tenant-facing instance).
; dbfilter = ^odoo$
