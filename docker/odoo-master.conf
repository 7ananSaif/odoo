[options]
; ---------------------------------------------------------------------------
; MASTER control instance — owner-only database management.
; ---------------------------------------------------------------------------
; This is the ONLY instance with the database manager enabled. It must never
; be reachable from the public internet:
;   * bound to 127.0.0.1 (http_interface below) and published only on the
;     host loopback (see the `odoo-master` service in docker-compose.yml),
;   * not referenced by any nginx upstream,
;   * started on demand via the `saas-master` compose profile.
; Reach it through an SSH tunnel:  ssh -L 8070:127.0.0.1:8070 you@server
;
; db_host / db_port / db_user / db_password are intentionally NOT set here:
; the image entrypoint injects them from the HOST/PORT/USER/PASSWORD env vars
; in .env, so no database credentials are committed to the repository.
addons_path = /opt/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
http_interface = 127.0.0.1
http_port = 8070
proxy_mode = False
; list_db = True keeps the database manager and the SaaS control panel
; (saas_manager module) available on this admin-only instance.
list_db = True
; The master is for database management only — never let it run scheduled
; jobs, or they would double-run against the same database as the public
; instance.
max_cron_threads = 0
; ---------------------------------------------------------------------------
; REQUIRED: replace with a long random value before first start, e.g.
;   python -c "import secrets; print(secrets.token_urlsafe(48))"
; This is the master password that gates create / duplicate / drop / backup /
; restore on this instance.
; ---------------------------------------------------------------------------
admin_passwd = CHANGE_ME_before_first_start
