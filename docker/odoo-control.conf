[options]
; ---------------------------------------------------------------------------
; odoo-control — owner control instance for the SaaS Manager (internal only)
; ---------------------------------------------------------------------------
; The SaaS Manager (see ../saas_manger and ../docker-compose.yml) provisions
; and manages one database per tenant. It does that through Odoo's HTTP and
; XML-RPC `db` service, which the PUBLIC `odoo` instance refuses (list_db =
; False, and nginx returns 404 for /xmlrpc/2/db). This instance is the one the
; manager talks to:
;
;   * list_db = True            — the manager may create / duplicate / drop.
;   * http_interface = 0.0.0.0  — reachable from the manager container over the
;                                 private compose network as odoo-control:8069.
;   * no host port, no nginx    — never exposed to the internet (see the
;                                 odoo-control service: it publishes-no port).
;   * max_cron_threads = 0      — the public instance owns the scheduled jobs,
;                                 so this one must never run them.
;
; It shares the same PostgreSQL database cluster and the same filestore volume
; as the public instance (one filestore per database), so a tenant created by
; the manager is immediately served by the public `odoo` service.
;
; db_host / db_port / db_user / db_password are intentionally NOT set here: the
; image entrypoint injects them from the HOST/PORT/USER/PASSWORD env vars in
; ../.env, so no database credentials are committed to the repository.

addons_path = /opt/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
http_interface = 0.0.0.0
http_port = 8069
proxy_mode = False
list_db = True
max_cron_threads = 0

; ---------------------------------------------------------------------------
; REQUIRED: the master password that gates create / duplicate / drop / backup /
; restore for the manager. It MUST be identical to SAAS_ODOO_MASTER_PASSWORD in
; ../.env (the value the manager sends to the `db` service).
;
; admin_passwd is a "file only" option in Odoo (odoo/tools/config.py) — it
; cannot be set from the command line or the environment — so it lives here.
; Generate one with:  python -c "import secrets; print(secrets.token_urlsafe(48))"
; ---------------------------------------------------------------------------
admin_passwd = X1ooSLJMAWw9O3nsklOLtqAUGRbho9nwe0iw2lQI-s1FyPUwShyJVvpAgTo5cZKp
