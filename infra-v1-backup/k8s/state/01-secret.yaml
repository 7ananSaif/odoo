# =============================================================================
# 01-secret.yaml — the SECOND kind of state: sensitive values.
#
# A Secret has the same shape as a ConfigMap (a set of key/value pairs) but
# carries a different contract and a different lifecycle:
#   * it is expected to hold credentials, tokens, and keys;
#   * Kubernetes keeps its contents out of `kubectl describe` and API-server
#     logs, and it can be encrypted at rest (see infra/k8s/eks-secrets-at-rest.md);
#   * RBAC can grant read access to ConfigMaps in a namespace while denying it
#     on Secrets.
#
# Apply:  kubectl apply -f infra/k8s/state/01-secret.yaml
# Read:   kubectl get secret db-secret -o yaml        # values are base64 here
#         kubectl get secret db-secret -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d
#
# `stringData` vs `data`
# ----------------------
# `data` requires base64-encoded values (what the API stores and returns).
# `stringData` accepts PLAINTEXT and the API server encodes it for you on
# write; it is never returned on read (read-back is always `data`, base64).
# Using `stringData` here keeps the manifest readable — but that readability is
# exactly why a real secret value must NEVER be committed in this form.
#
# THIS IS THE LOCAL TEST VALUE ONLY.
# --------------------------------
# The placeholder below is a throwaway for the kind exercise. It is deliberately
# not a real credential and is safe to commit for that reason. The production
# path — and the whole point of ../../eks/secrets-at-rest.md and
# ../config-secret-plan.md — is that real values are NOT written into a
# manifest at all: they are synced from AWS Secrets Manager into a Secret by the
# External Secrets Operator, or read from the Secrets Store CSI driver. This
# file exists so the exercise can be run end-to-end without a cloud account.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: state-demo
    app.kubernetes.io/part-of: odoo
type: Opaque
# `type: Opaque` is the generic catch-all. The typed variants
# (kubernetes.io/tls, kubernetes.io/dockerconfigjson, kubernetes.io/basic-auth)
# exist so the API and controllers understand the payload's shape — use them
# when the consumer expects a specific key layout. Generic credentials like
# these belong to Opaque.
stringData:
  # Consumed by the postgres container as POSTGRES_PASSWORD.
  POSTGRES_PASSWORD: "local-demo-password-change-me"
  # The same value Odoo uses for the app connection. Kept as a separate key so
  # the two consumers can be rotated independently (the migration plan calls
  # this out for the real stack).
  ODOO_DB_PASSWORD: "local-demo-password-change-me"
