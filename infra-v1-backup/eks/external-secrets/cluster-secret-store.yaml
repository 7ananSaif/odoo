# How External Secrets Operator authenticates to AWS Secrets Manager.
#
# IRSA, not static keys: the operator's ServiceAccount carries the IAM role ARN
# as an annotation (set with `eksctl create iamserviceaccount`, see README.md),
# EKS projects a service-account token for that annotation, and the store
# exchanges the token for temporary credentials. No AWS key is stored in the
# cluster or in this repository.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      # Must match the cluster and the secrets. A store pointing at the wrong
      # region fails at sync time with ResourceNotFoundException, which the
      # deploy reports through the ExternalSecret's status conditions.
      region: eu-north-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
