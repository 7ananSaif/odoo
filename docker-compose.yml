# =============================================================================
# docker-compose.yml — Odoo 19 + Postgres 16 for invoice_agent
#
# Usage:
#   cp .env.example .env   # fill in secrets
#   docker compose up -d          # start
#   docker compose down -v        # stop + delete named volumes (DESTRUCTIVE)
#   docker compose logs -f        # tail logs
# =============================================================================

services:
  invoice-ai:
    build:
      context: ./invoice-ai
    restart: unless-stopped
    env_file: .env
    environment:
      INVOICE_AI_JWT_SECRET: ${INVOICE_AI_JWT_SECRET:-}
      INVOICE_AI_JWT_AUDIENCE: invoice-ai
      INVOICE_AI_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Redis — LLM extraction result cache (avoids redundant Claude calls)
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LLM_CACHE_TTL_HOURS: "168"
    # Loopback-only exposure of the health endpoint. The deploy pipeline
    # (invoice-ai-deploy.yml) polls http://127.0.0.1:8100/healthz FROM THE
    # HOST as its health gate — without this mapping the probe always gets
    # connection-refused (HTTP 000) even when the container itself is fine.
    # Nginx reaches the service over the private compose network as
    # "invoice-ai:8100"; nothing outside the host can reach this port.
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=5)\"" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  db:
    # pgvector image keeps the Postgres 16 base and preloads the vector
    # extension — the `CREATE EXTENSION vector` init below (idempotent on
    # every fresh-volume start) enables it per database. v0.10: vendor-doc
    # RAG embeddings live in a vector(1024) column with an HNSW cosine index.
    #
    # PINNED (version + base-OS variant + digest): the floating `pg16` tag
    # silently switched its Debian base (trixie → bookworm), which changed
    # glibc's collation version under a live data volume and caused
    # "collation version mismatch" warnings on every deploy. libc-collated
    # indexes can be misordered across such a switch, so the base OS must
    # never drift implicitly. To upgrade the db image deliberately:
    #   1. pick the new tag/digest,
    #   2. run scripts/fix_collation.sh after `up -d` (REINDEX + REFRESH
    #      COLLATION VERSION for every database),
    #   3. verify no mismatch warnings remain.
    image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    # Observability + slow-query diagnostics (v0.5 "Tuned" work):
    #   - pg_stat_statements: per-query execution stats (total_exec_time,
    #     calls, shared hit/read buffers) — rank real offenders.
    #   - track_io_timing=on: buffers + actual I/O timings in EXPLAIN.
    #   - log_min_duration_statement=200: log slow queries for follow-up.
    # v0.10 adds `vector` to shared_preload_libraries (pgvector image).
    #
    # Loopback-only port 5432: lets a host-side client reach the db without
    # exposing it to the LAN. Production: keep this commented out — nginx/
    # odoo reach the db over the compose network.
    ports:
      - "127.0.0.1:5434:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements,vector
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=200
    volumes:
      # Idempotent vector-extension bootstrap: runs once on a fresh volume
      # (and is a no-op on existing volumes). Kept small so Odoo's own
      # migrations never race it (Odoo depends_on db: healthy).
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    env_file: .env
    environment:
      # Credentials come exclusively from .env — never committed.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-invoice_agent}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-invoice_agent}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Loopback-only management UI for the local exercise (watch ack counts,
    # declare test queues with rabbitmqadmin). The AMQP port 5672 is NEVER
    # exposed: Odoo and the AI worker reach the broker over the private
    # compose network only. Production: keep this ports block commented out
    # entirely — no public 5672 or 15672 on EC2 (see docker-compose.prod.yml).
    ports:
      - "127.0.0.1:15672:15672"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  worker:
    build:
      context: ./invoice-ai
    restart: unless-stopped
    command: python -m app.consumer
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file: .env
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-invoice_agent}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS:-invoice_agent}
      INVOICE_AI_JWT_SECRET: ${INVOICE_AI_JWT_SECRET:-}
      INVOICE_AI_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Redis — LLM extraction result cache (avoids redundant Claude calls)
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      LLM_CACHE_TTL_HOURS: "168"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Session store (session_redis) + LLM extraction cache (llm_cache)
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Loopback-only for local Redis debugging. App containers reach Redis
    # over the private compose network as `redis:6379` — never via localhost.
    ports:
      - "127.0.0.1:6379:6379"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  odoo:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      HOST: ${ODOO_DB_HOST:-db}
      PORT: ${ODOO_DB_PORT:-5432}
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      # Pass Anthropic API key securely from environment
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Shared JWT secret for extract.done result verification. Must equal
      # INVOICE_AI_JWT_SECRET in .env (the worker signs with it; the Odoo
      # result consumer verifies with it). Set in .env not source.
      INVOICE_AI_JWT_SECRET: ${INVOICE_AI_JWT_SECRET:-}
      # RabbitMQ — forwarded so queue.publisher connects with the same
      # credentials the broker container was created with (RABBITMQ_HOST
      # defaults to the compose service name "rabbitmq" in code).
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-invoice_agent}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS:-invoice_agent}
      # Tell Odoo it's behind a reverse proxy so it trusts
      # X-Forwarded-For and X-Forwarded-Proto headers.
      # Equivalent to proxy_mode = True in odoo.conf
      PROXY_MODE: "True"
      # Public base URL. invoice_agent's post_init_hook seeds Odoo's
      # web.base.url system parameter from this on every install/upgrade.
      # Value comes exclusively from the environment (see .env / env_file).
      URL: ${URL:-}
      # Base URL consumed by the Hotel module's QWeb templates
      # (hotel/models/ir_http.py: IrHttp.get_public_base_url()). env_file already
      # forwards it; listed explicitly for parity with URL above.
      BASE_URL: ${BASE_URL:-}
      # Redis — used by session_redis addon for HTTP session storage
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ODOO_SESSION_REDIS_PREFIX: "odoo-session:"
      ODOO_SESSION_REDIS_TTL_DAYS: "7"
    ports:
      # Production: comment these out! Nginx is the only entry point.
      # Ports 8069 and 8072 are exposed only for local dev / debugging.
      - "127.0.0.1:8069:8069"
      - "127.0.0.1:8072:8072"
    volumes:
      # Bind-mount custom_addons for live addon development.
      # Changes to .py / .xml files in custom_addons/ are reflected
      # on the container's filesystem instantly.
      - ./custom_addons:/mnt/extra-addons
      # Named volume: filestore survives container recreation
      - odoo-web-data:/var/lib/odoo
      # Public-instance config, mounted read-only over the image default.
      # It sets list_db = False (no database manager for anyone) and
      # proxy_mode = True. See docker/odoo.conf for the full rationale.
      - ./docker/odoo.conf:/etc/odoo/odoo.conf:ro
    # --no-database-list mirrors list_db = False from docker/odoo.conf as a
    # belt-and-suspenders default: the lock survives even if the config mount
    # is ever removed or replaced.
    #
    # --dev=reload enables hot-reload of Python files when running on Linux
    # hosts (EC2, WSL2, native Linux). On Docker Desktop for Windows the
    # bind-mount doesn't emit inotify events, so you must restart the
    # container after .py edits:  docker compose restart odoo
    command: odoo --addons-path=/opt/odoo/addons,/mnt/extra-addons --no-database-list --dev=reload,qweb,werkzeug,xml
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ============================================================================
  # odoo-master — OWNER-ONLY control instance (never exposed publicly)
  #
  # The public `odoo` service runs with list_db = False, so nobody can manage
  # databases from its login page. This companion instance is the ONLY one with
  # the database manager enabled; it exists so the owner keeps full management
  # (web "Manage Databases" plus the saas_manager control panel) without
  # reopening the public surface. It is deliberately locked down:
  #   * `profiles: [saas-master]` — NOT started by a plain `docker compose up`;
  #   * bound to 127.0.0.1 only (loopback port 8070) with no nginx upstream;
  #   * `--max-cron-threads=0` so it never double-runs scheduled jobs;
  #   * its own config (docker/odoo-master.conf) with a private master password.
  #
  # Use it on demand, then reach it through an SSH tunnel from your machine:
  #   docker compose --profile saas-master up -d odoo-master
  #   ssh -L 8070:127.0.0.1:8070 you@server
  #   → http://127.0.0.1:8070   (Manage Databases / SaaS ▸ Tenants)
  #   docker compose --profile saas-master stop odoo-master
  # Stop it when done: while it is up, the database manager is reachable on the
  # host loopback — keep it stopped when you are not managing databases.
  # ============================================================================
  odoo-master:
    build:
      context: .
    profiles: [ "saas-master" ]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Database coordinates come from .env via the image entrypoint, exactly
      # like the public service — no credentials are written to any file.
      HOST: ${ODOO_DB_HOST:-db}
      PORT: ${ODOO_DB_PORT:-5432}
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      # Not behind a proxy: never trust X-Forwarded-* on this instance.
      PROXY_MODE: "False"
    ports:
      # Loopback ONLY. Nothing beyond the host (not even nginx) can reach it.
      - "127.0.0.1:8070:8070"
    volumes:
      - ./custom_addons:/mnt/extra-addons
      # Same filestore as the public instance — one filestore per DB.
      - odoo-web-data:/var/lib/odoo
      # Admin-only config: list_db = True, loopback bind, cron off, and the
      # private master password. See docker/odoo-master.conf.
      - ./docker/odoo-master.conf:/etc/odoo/odoo.conf:ro
    command: odoo --addons-path=/opt/odoo/addons,/mnt/extra-addons --http-port=8070 --max-cron-threads=0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ============================================================================
  # odoo-control — INTERNAL control instance for the SaaS Manager
  #
  # The manager (see saas_manger/) creates and manages one database per tenant
  # through Odoo's `db` service, which the public `odoo` instance refuses
  # (list_db = False, and nginx 404s /xmlrpc/2/db). This instance enables it
  # (list_db = True in docker/odoo-control.conf) and is reachable ONLY on the
  # private compose network as `odoo-control:8069`:
  #   * it publishes NO host port and is referenced by NO nginx upstream;
  #   * it shares the same database and filestore volume as the public instance,
  #     so tenants it creates are served by `odoo` immediately;
  #   * --max-cron-threads=0 so only the public instance runs scheduled jobs.
  #
  # Started together with the manager under the `saas-manager` profile:
  #   docker compose --profile saas-manager up -d
  # ============================================================================
  odoo-control:
    build:
      context: .
    profiles: [ "saas-manager" ]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      HOST: ${ODOO_DB_HOST:-db}
      PORT: ${ODOO_DB_PORT:-5432}
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      # Not behind a proxy: never trust X-Forwarded-* on this instance.
      PROXY_MODE: "False"
      # Harmony with the public instance: if the session_redis addon is active
      # in a tenant database, this instance needs Redis too — on its own key
      # prefix so its sessions never collide with the public instance's.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ODOO_SESSION_REDIS_PREFIX: "odoo-control-session:"
    volumes:
      - ./custom_addons:/mnt/extra-addons
      # Same filestore as the public instance — one filestore per database.
      - odoo-web-data:/var/lib/odoo
      # list_db = True, no proxy, no cron, and the private master password.
      # See docker/odoo-control.conf.
      - ./docker/odoo-control.conf:/etc/odoo/odoo.conf:ro
    command: odoo --addons-path=/opt/odoo/addons,/mnt/extra-addons --http-port=8069 --max-cron-threads=0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ============================================================================
  # saas-manager-web / -worker / -beat — the SaaS control panel
  #
  # One image (built from ./saas_manger), three roles:
  #   * web    — FastAPI/uvicorn on :8080, bound to host loopback only. Reach it
  #              through an SSH tunnel (owner-only), exactly like odoo-master:
  #                ssh -L 8080:127.0.0.1:8080 you@server  →  http://127.0.0.1:8080
  #   * worker — Celery worker for provisioning / updates / backups
  #   * beat   — Celery beat scheduler (usage refresh + daily billing sweep)
  #
  # Each role sets its own environment explicitly (no YAML anchors/merge keys —
  # the editor's YAML formatter rewrites them and breaks the file). The web role
  # creates the manager database and schema; worker/beat only wait for Postgres.
  #
  # Started with the control instance under the `saas-manager` profile:
  #   docker compose --profile saas-manager up -d
  # ============================================================================
  saas-manager-web:
    build:
      context: ./saas_manger
    profiles: [ "saas-manager" ]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      odoo-control:
        condition: service_started
    environment:
      # --- web app ---------------------------------------------------------
      SECRET_KEY: ${SAAS_SECRET_KEY:-change-me-session-signing-key}
      OWNER_EMAIL: ${SAAS_OWNER_EMAIL:-owner@example.com}
      OWNER_NAME: ${SAAS_OWNER_NAME:-SaaS Owner}
      SECRETS_KEY: ${SAAS_SECRETS_KEY:-}
      # --- manager database (created by the entrypoint on first boot) ------
      MANAGER_DB_URL: postgresql+psycopg2://${POSTGRES_USER:-odoo}:${POSTGRES_PASSWORD:-odoo}@db:5432/saas_manager
      # --- Odoo (internal control instance) --------------------------------
      ODOO_BASE_URL: http://odoo-control:8069
      ODOO_DOMAIN: ${DOMAIN:-example.com}
      ODOO_MASTER_PASSWORD: ${SAAS_ODOO_MASTER_PASSWORD:-}
      ODOO_MANAGER_TOKEN: ${SAAS_MANAGER_TOKEN:-}
      ODOO_DATA_DIR: /var/lib/odoo
      # --- PostgreSQL client tools (installed in the image) ----------------
      PG_DUMP: pg_dump
      PG_RESTORE: pg_restore
      PG_PSQL: psql
      PG_HOST: db
      PG_PORT: "5432"
      PG_USER: ${POSTGRES_USER:-odoo}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      BACKUP_DIR: /app/backups
      # --- Celery (dedicated Redis DBs so keys never clash) ----------------
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      UPDATE_MAX_PARALLEL: "2"
      SCHEDULER_ENABLED: "true"
      # --- "Open in Odoo" auto-login (browser-reachable URL) ---------------
      # The manager talks to Odoo internally at ODOO_BASE_URL, but a browser
      # cannot resolve that host. Set SAAS_ODOO_PUBLIC_URL to the URL the
      # *browser* uses (empty → fall back to each tenant's subdomain URL).
      ODOO_PUBLIC_URL: ${SAAS_ODOO_PUBLIC_URL:-}
      # --- entrypoint: create the DB + schema on the web role only ---------
      SAAS_CREATE_DB: "1"
      SAAS_DB_INIT: "1"
    ports:
      # Loopback only — the owner reaches it through an SSH tunnel. The host
      # port is configurable (SAAS_MANAGER_PORT) so a conflict with a port
      # already bound on the host can be worked around from .env alone.
      - "127.0.0.1:${SAAS_MANAGER_PORT:-8080}:8080"
    volumes:
      # Tenant backups (pg_dump + filestore zips) survive container recreation.
      - saas-manager-backups:/app/backups
      # The Odoo filestore, so backups capture it and restores can write it back.
      - odoo-web-data:/var/lib/odoo
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)\"" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  saas-manager-worker:
    build:
      context: ./saas_manger
    profiles: [ "saas-manager" ]
    restart: unless-stopped
    depends_on:
      saas-manager-web:
        condition: service_started
    environment:
      # --- web app ---------------------------------------------------------
      SECRET_KEY: ${SAAS_SECRET_KEY:-change-me-session-signing-key}
      OWNER_EMAIL: ${SAAS_OWNER_EMAIL:-owner@example.com}
      OWNER_NAME: ${SAAS_OWNER_NAME:-SaaS Owner}
      SECRETS_KEY: ${SAAS_SECRETS_KEY:-}
      # --- manager database ------------------------------------------------
      MANAGER_DB_URL: postgresql+psycopg2://${POSTGRES_USER:-odoo}:${POSTGRES_PASSWORD:-odoo}@db:5432/saas_manager
      # --- Odoo (internal control instance) --------------------------------
      ODOO_BASE_URL: http://odoo-control:8069
      ODOO_DOMAIN: ${DOMAIN:-example.com}
      ODOO_MASTER_PASSWORD: ${SAAS_ODOO_MASTER_PASSWORD:-}
      ODOO_MANAGER_TOKEN: ${SAAS_MANAGER_TOKEN:-}
      ODOO_DATA_DIR: /var/lib/odoo
      # --- PostgreSQL client tools (installed in the image) ----------------
      PG_DUMP: pg_dump
      PG_RESTORE: pg_restore
      PG_PSQL: psql
      PG_HOST: db
      PG_PORT: "5432"
      PG_USER: ${POSTGRES_USER:-odoo}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      BACKUP_DIR: /app/backups
      # --- Celery (dedicated Redis DBs so keys never clash) ----------------
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      UPDATE_MAX_PARALLEL: "2"
      SCHEDULER_ENABLED: "true"
      # --- entrypoint: only the web role creates the DB and schema ---------
      SAAS_CREATE_DB: "0"
      SAAS_DB_INIT: "0"
    command: python -m celery -A app.workers.celery_app.celery_app worker --loglevel=INFO -Q default,updates,backups
    volumes:
      - saas-manager-backups:/app/backups
      - odoo-web-data:/var/lib/odoo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  saas-manager-beat:
    build:
      context: ./saas_manger
    profiles: [ "saas-manager" ]
    restart: unless-stopped
    depends_on:
      saas-manager-web:
        condition: service_started
    environment:
      # --- web app ---------------------------------------------------------
      SECRET_KEY: ${SAAS_SECRET_KEY:-change-me-session-signing-key}
      OWNER_EMAIL: ${SAAS_OWNER_EMAIL:-owner@example.com}
      OWNER_NAME: ${SAAS_OWNER_NAME:-SaaS Owner}
      SECRETS_KEY: ${SAAS_SECRETS_KEY:-}
      # --- manager database ------------------------------------------------
      MANAGER_DB_URL: postgresql+psycopg2://${POSTGRES_USER:-odoo}:${POSTGRES_PASSWORD:-odoo}@db:5432/saas_manager
      # --- Odoo (internal control instance) --------------------------------
      ODOO_BASE_URL: http://odoo-control:8069
      ODOO_DOMAIN: ${DOMAIN:-example.com}
      ODOO_MASTER_PASSWORD: ${SAAS_ODOO_MASTER_PASSWORD:-}
      ODOO_MANAGER_TOKEN: ${SAAS_MANAGER_TOKEN:-}
      ODOO_DATA_DIR: /var/lib/odoo
      # --- PostgreSQL client tools (installed in the image) ----------------
      PG_DUMP: pg_dump
      PG_RESTORE: pg_restore
      PG_PSQL: psql
      PG_HOST: db
      PG_PORT: "5432"
      PG_USER: ${POSTGRES_USER:-odoo}
      PG_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      BACKUP_DIR: /app/backups
      # --- Celery (dedicated Redis DBs so keys never clash) ----------------
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      UPDATE_MAX_PARALLEL: "2"
      SCHEDULER_ENABLED: "true"
      # --- entrypoint: only the web role creates the DB and schema ---------
      SAAS_CREATE_DB: "0"
      SAAS_DB_INIT: "0"
    command: python -m celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    volumes:
      - saas-manager-backups:/app/backups
      - odoo-web-data:/var/lib/odoo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # ============================================================================
  # nginx — Reverse proxy, TLS termination, websocket forwarding
  #
  # This is the ONLY service exposed to the internet. Ports 80 and 443
  # must be open in the EC2 security group. Port 8069 on the Odoo service
  # is bound ONLY to 127.0.0.1 for local debugging — the security group
  # should NOT open 8069 to 0.0.0.0/0.
  # ============================================================================
  nginx:
    image: nginx:alpine
    restart: always
    environment:
      - DOMAIN=${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/templates:ro
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    depends_on:
      - odoo
      - invoice-ai
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # certbot — Let's Encrypt TLS certificate issuance and renewal
  #
  # On first run, manually execute:
  #   docker compose run --rm certbot certonly --webroot \
  #       -w /var/www/certbot -d invoices.<domain>
  #
  # Auto-renewal happens every 12 hours via the sleep loop below.
  # After renewal, nginx must be reloaded:
  #   docker compose exec nginx nginx -s reload
  # ============================================================================
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while true; do certbot renew --quiet --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"

volumes:
  odoo-db-data:
    name: odoo-db-data
  odoo-web-data:
    name: odoo-web-data
  rabbitmq-data:
    name: rabbitmq-data
  redis-data:
    name: redis-data
  certbot-www:
    name: certbot-www
  certbot-conf:
    name: certbot-conf
  saas-manager-backups:
    name: saas-manager-backups
