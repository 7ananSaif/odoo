# =============================================================================
# 01-secret.yaml — local-only database credentials + the DATABASE_URL.
#
# These are DELIBERATE PLACEHOLDERS for a laptop cluster. Nothing here is a
# secret in any real sense: the database is only reachable from inside the
# cluster (Service is ClusterIP, no Ingress, no host port), and the values are
# committed on purpose so `make k8s-deploy` works with no setup step.
#
# The full-infra option is the opposite by design: there the chart sets
# `secret.existingSecret: true` and the values come from AWS Secrets Manager
# via External Secrets (see full-infra/eks/external-secrets/). This file must
# never be copied there.
#
# WHY BOTH `DATABASE_URL` AND THE DISCRETE KEYS
# ---------------------------------------------
# The Odoo image's entrypoint (docker/entrypoint.sh -> /entrypoint.sh in the
# upstream image) does NOT read a URL. It reads HOST / PORT / USER / PASSWORD
# and turns them into --db_host/--db_port/--db_user/--db_password. So the
# `odoo` Deployment consumes the discrete keys (ODoo_db_* below).
#
# `DATABASE_URL` is the same credentials in the single-string form that psql,
# pg_dump/pg_restore, `make db-shell`, `make db-backup` and any migration
# tooling expect. It is derived from the same values, so it cannot drift - but
# it is NOT what Odoo itself parses. Keeping both is what lets the shell tools
# and the server agree on one set of credentials.
#
# Rotating locally: change the three values below, then
#   make k8s-down && make k8s-destroy && make k8s-deploy
# (a password change alone does not re-init the database volume: PostgreSQL
# only honours POSTGRES_PASSWORD on an empty data directory).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: odoo-db
  namespace: odoo-local
  labels:
    app.kubernetes.io/part-of: odoo-invoice-agent
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # --- consumed by the postgres container (initdb on a fresh volume) --------
  POSTGRES_DB: odoo
  POSTGRES_USER: odoo
  POSTGRES_PASSWORD: change-me-local-only

  # --- consumed by the odoo container (entrypoint -> --db_* flags) ---------
  ODOO_DB_USER: odoo
  ODOO_DB_PASSWORD: change-me-local-only

  # --- consumed by client tooling from inside the cluster -------------------
  # Host is the postgres Service name, so this URL resolves in-cluster only.
  DATABASE_URL: postgresql://odoo:change-me-local-only@postgres:5432/odoo
