# =============================================================================
# 07-odoo-deployment.yaml — the application: Odoo 19 + the invoice_agent addon.
#
# PORT / LANGUAGE / DB, all detected from the repo rather than guessed:
#   * port 8069           Dockerfile ("The official odoo:19 image exposes 8069
#                         8072"), docker/odoo.conf (http_port = 8069),
#                         docker-compose.yml `127.0.0.1:8069:8069`.
#   * database `odoo`     docker-compose.yml (POSTGRES_DB/POSTGRES_USER=odoo),
#                         full-infra/helm values `postgres.database: odoo`.
#   * addons path         Dockerfile COPY target + docker/odoo.conf
#                         (`addons_path = /opt/odoo/addons,/mnt/extra-addons`).
#   * data dir            docker/odoo.conf (`data_dir = /var/lib/odoo`).
#
# ENV NAMES ARE NOT FREE-FORM. The image's entrypoint reads HOST / PORT / USER /
# PASSWORD and turns them into --db_host/--db_port/--db_user/--db_password; it
# writes PROXY_MODE into odoo.conf. So the ConfigMap's ODOO_DB_* keys are mapped
# onto those names here, once, instead of duplicating the values.
#
# THE PROBES ARE THE INTERESTING PART — each one asks a different question, and
# all three choices are carried over from the Helm chart, where they were
# measured against a live cluster (see full-infra/helm/odoo-stack/values.yaml):
#
#   startup  tcpSocket. "Has the process finished booting?" An HTTP probe here
#            would make startup depend on the database: with --database=odoo and
#            no schema yet, /web/health answers 500 KeyError: 'ir.http', the
#            probe budget expires, and the container restarts forever.
#
#   readiness exec python3 urlopen(..., ?db_server_status=true). "May this pod
#            take traffic?" The DB-aware form returns 500 when Postgres is
#            unreachable, so a pod that is alive but cannot reach its database
#            is pulled out of the Service instead of serving errors.
#            WHY NOT httpGet: kubelet builds the request with url.URL{Path:...}
#            and percent-encodes '?' to %3F, so the server receives
#            /web/health%3Fdb_server_status=true and answers 404 - the pod would
#            never become ready. Hence exec + python.
#
#   liveness tcpSocket. "Is this process wedged?" Deliberately NOT the health
#            route: liveness must judge the PROCESS. Making it depend on the
#            database turns a recoverable DB problem into a crash loop.
#
# FIRST BOOT: this Deployment does not create the schema — the `odoo-init` Job
# (09-odoo-init-job.yaml) runs `--init=base` once. Until it succeeds, this pod is
# Running but NOT Ready, which is correct and, with the probes above, harmless:
# readiness failing does not restart a container.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: odoo-local
  labels:
    app.kubernetes.io/part-of: odoo-invoice-agent
    app.kubernetes.io/name: odoo
    app.kubernetes.io/component: odoo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: odoo
  strategy:
    type: Recreate
    # Recreate, not RollingUpdate: the filestore PVC is ReadWriteOnce, so two
    # pods cannot hold it at once anyway. Recreate makes that explicit instead
    # of leaving the rollout to discover it as a multi-attach error.
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: odoo-invoice-agent
        app.kubernetes.io/name: odoo
        app.kubernetes.io/component: odoo
    spec:
      # A report render or an in-flight upload needs time to finish on SIGTERM.
      terminationGracePeriodSeconds: 60
      securityContext:
        # fsGroup makes the kubelet chgrp the mounted volume to this gid and
        # grant group write. Without it a fresh volume arrives root:root 0755
        # and the unprivileged `odoo` user (uid 100 / gid 101 in the official
        # image) cannot create /var/lib/odoo/filestore - the pod dies on boot.
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Odoo's entrypoint connects to the database during boot and EXITS when
        # the connection is refused:
        #   Database connection failure: connection to server at "postgres"
        #   ... port 5432 failed: Connection refused
        # Kubernetes orders nothing between this Deployment and the postgres
        # StatefulSet, so the app container can legitimately start first and
        # crash-loop until Postgres catches up. Measured: 0 restarts on Docker
        # Desktop (the DB wins the race) and 3 restarts on kind (it loses).
        # Probes cannot fix this - the PROCESS is gone, it is not merely
        # unready. This gate is the fix: the app container does not start until
        # a TCP connection to Postgres is accepted.
        #
        # It reuses the app image, so there is no extra pull: python3 and the
        # HOST/PORT env vars (the entrypoint contract) are already there.
        - name: wait-for-postgres
          image: odoo-local:19
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - -c
            - |
              import os, socket, sys, time
              host, port = os.environ["HOST"], int(os.environ["PORT"])
              for attempt in range(150):          # 150 x 2s = a 300s budget
                  try:
                      socket.create_connection((host, port), timeout=3).close()
                      print("postgres is accepting connections", flush=True)
                      sys.exit(0)
                  except OSError as exc:
                      print(f"waiting for postgres at {host}:{port} ({exc})", flush=True)
                      time.sleep(2)
              sys.exit("postgres did not accept a connection within 300s")
          env:
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: odoo-config
                  key: ODOO_DB_HOST
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: odoo-config
                  key: ODOO_DB_PORT
      containers:
        - name: odoo
          # Built by k8s-local/Dockerfile.app from the repo's own Dockerfile.
          # `make image` rebuilds it; `k8s-up` loads it into a kind cluster.
          image: odoo-local:19
          imagePullPolicy: IfNotPresent
          # args, never `command`: `command` would replace the image's
          # docker-entrypoint.sh, which is exactly what translates HOST/PORT/
          # USER/PASSWORD (and PROXY_MODE) into --db_* flags and odoo.conf.
          args:
            - odoo
            - --addons-path=/opt/odoo/addons,/mnt/extra-addons
            - --database=odoo
            - --http-port=8069
            # ALWAYS explicit. Unset, Odoo sizes its pool from
            # multiprocessing.cpu_count(), which reports the NODE's cores and
            # ignores the container limit: on a many-core host every process is
            # OOM-killed in turn and the pod never becomes ready.
            - --workers=2
            # Only one component may run cron. Single replica here, so 1.
            - --max-cron-threads=1
            - --db_maxconn=16
            - --proxy-mode
            - --no-database-list
          ports:
            - name: http
              containerPort: 8069
              protocol: TCP
            # Longpolling / websocket (bus, live chat). Not exposed by a Service
            # in this option; declared so the pod's contract is complete.
            - name: longpolling
              containerPort: 8072
              protocol: TCP
          env:
            # --- database connection (entrypoint contract) ------------------
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: odoo-config
                  key: ODOO_DB_HOST
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: odoo-config
                  key: ODOO_DB_PORT
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: odoo-db
                  key: ODOO_DB_USER
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: odoo-db
                  key: ODOO_DB_PASSWORD
            # --- proxy / HTTP ----------------------------------------------
            - name: PROXY_MODE
              valueFrom:
                configMapKeyRef:
                  name: odoo-config
                  key: ODOO_PROXY_MODE
          resources:
            # Traced from the chart's odoo.resources (which traces to
            # docker-compose.yml deploy.resources: reservations 512M, limits 2G).
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          # --- startup: "is the process listening yet?" ---------------------
          # 5s x 60 = a 300s budget for a cold first boot. Readiness and
          # liveness are held off until this passes, so neither needs a guessed
          # initialDelaySeconds.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          # --- readiness: "can this pod reach its database?" ----------------
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8069/web/health?db_server_status=true', timeout=5)"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          # --- liveness: "is the process wedged?" ---------------------------
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: filestore
              mountPath: /var/lib/odoo
      volumes:
        - name: filestore
          persistentVolumeClaim:
            claimName: odoo-filestore
