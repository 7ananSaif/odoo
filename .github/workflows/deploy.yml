name: Deploy — EKS Production

# Sole path to production.
#
# Shape of the pipeline (this replaced the old SSH + `docker compose` EC2 path,
# which is retired — see infra/runbook.md §4):
#
#   1. CI gate            ./.github/workflows/ci.yml (lint, tests, terraform, security)
#   2. Config guard       fail early on missing secrets / unfilled placeholders
#   3. Chart gate         helm lint + helm template before anything touches prod
#   4. Image resolve      pick the exact image this commit built and wait for it
#   5. OIDC → AWS         short-lived IAM role, no long-lived AWS keys
#   6. Preflight          Secret, StorageClass and the database itself
#   7. helm upgrade       --install --wait with the production values file
#   8. Diagnostics        pods/events/logs dumped if the release did not converge
#   9. Rollout assert     kubectl rollout status on the rendered Deployment
#  10. Smoke test         public HTTPS surface (scripts/smoke-test-eks.sh)
#  11. Rollback           previous revision, or uninstall a failed first install
#
# The upgrade deliberately does NOT use `--atomic`. Atomic uninstalls the
# release the moment the wait budget expires, which also deletes the pods, the
# events and the container logs - the only evidence of *why* it never became
# ready. A brand-new production release then fails with the single line
# "release odoo failed, and has been uninstalled due to atomic being set:
# context deadline exceeded" and nothing else. The same guarantee is provided
# explicitly below: dump diagnostics first, then roll back to the previous
# revision (or uninstall, if this run created the release).
#
# Nothing here SSHes anywhere and nothing runs `docker compose`.

on:
    push:
        branches: [production]

concurrency:
    group: deploy-production
    cancel-in-progress: false

# OIDC token needed for configure-aws-credentials (IAM role assumption).
permissions:
    id-token: write
    contents: read

env:
    # Helm release name, namespace and chart path in one place — every step
    # below refers to these instead of repeating literals.
    RELEASE: odoo
    NAMESPACE: odoo
    CHART: infra/helm/odoo-stack
    VALUES_FILE: infra/helm/odoo-stack/values.production.yaml
    AWS_REGION: ${{ secrets.AWS_REGION }}
    EKS_CLUSTER: ${{ secrets.EKS_CLUSTER }}
    # How long to wait for the image this commit built to appear in the
    # registry (the image build runs as its own workflow, in parallel).
    IMAGE_WAIT_SECONDS: "900"
    # Budget for `helm upgrade --wait`. Must exceed the chart's startup probe
    # budget (5s x 60 = 300s) plus the image pull on a cold node plus the EFS
    # mount. 12m leaves headroom without turning a broken deploy into a stall.
    HELM_TIMEOUT: 12m

jobs:
    ci:
        uses: ./.github/workflows/ci.yml
        secrets: inherit

    deploy:
        needs: [ci]
        runs-on: ubuntu-latest
        environment: production

        steps:
            - uses: actions/checkout@v4

            # ------------------------------------------------------------------
            # Fail fast when the deploy configuration is not present.
            #
            # Without this, an unset AWS_EKS_DEPLOY_ROLE_ARN is passed as an
            # empty 'role-to-assume' and configure-aws-credentials stops with
            # the opaque "Could not load credentials from any providers".
            # ------------------------------------------------------------------
            - name: Verify deploy configuration is present
              env:
                  ROLE_ARN: ${{ secrets.AWS_EKS_DEPLOY_ROLE_ARN }}
                  DOMAIN: ${{ secrets.DOMAIN }}
                  IMAGE_REPO_VAR: ${{ vars.ODOO_IMAGE_REPOSITORY }}
                  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
                  # SECRET_DB_HOST, not DB_HOST: DB_HOST is published once, by
                  # the render step, and read from $GITHUB_ENV thereafter. A
                  # second declaration here would be a second source of truth.
                  SECRET_DB_HOST: ${{ secrets.ODOO_DB_HOST }}
                  REGION: ${{ secrets.AWS_REGION }}
                  CLUSTER: ${{ secrets.EKS_CLUSTER }}
              run: |
                  set -u
                  missing=0

                  if [ -z "$ROLE_ARN" ]; then
                      echo "::error::secrets.AWS_EKS_DEPLOY_ROLE_ARN is not set for the 'production' environment."
                      echo "::error::Add it under Settings > Environments > production > Environment secrets."
                      echo "::error::Without it configure-aws-credentials has no role to assume and every deploy stops here."
                      missing=1
                  fi

                  if [ -z "$DOMAIN" ]; then
                      echo "::error::secrets.DOMAIN is not set for the 'production' environment."
                      echo "::error::It is the public hostname the post-deploy smoke test checks."
                      missing=1
                  fi

                  if [ -z "$REGION" ]; then
                      echo "::error::secrets.AWS_REGION is not set for the 'production' environment."
                      missing=1
                  fi

                  if [ -z "$CLUSTER" ]; then
                      echo "::error::secrets.EKS_CLUSTER is not set for the 'production' environment."
                      missing=1
                  fi

                  # production runs with postgres.enabled: false (RDS is the
                  # database), so there is no in-cluster Service to fall back to.
                  # An empty ODOO_DB_HOST leaves the chart pointing at
                  # "<release>-odoo-stack-postgres", which production never
                  # deploys: Odoo then fails its DB-aware readiness probe
                  # forever and the deploy dies with "context deadline exceeded"
                  # and no indication that the host was the problem.
                  if [ -z "$SECRET_DB_HOST" ]; then
                      echo "::error::secrets.ODOO_DB_HOST is not set for the 'production' environment."
                      echo "::error::It is the RDS endpoint (terraform output rds_hostname)."
                      echo "::error::Without it the chart falls back to an in-cluster Postgres Service that production does not deploy."
                      missing=1
                  fi

                  # The image reference must come from somewhere explicit. In
                  # order of preference: a repo variable (ECR/other registry),
                  # then the Docker Hub account the build workflow pushes to.
                  if [ -z "$IMAGE_REPO_VAR" ] && [ -z "$DOCKERHUB_USER" ]; then
                      echo "::error::No image registry configured."
                      echo "::error::Set repo variable ODOO_IMAGE_REPOSITORY (e.g. <account>.dkr.ecr.eu-west-1.amazonaws.com/odoo),"
                      echo "::error::or the DOCKERHUB_USERNAME secret that docker-push.yml pushes with."
                      missing=1
                  fi

                  # values.production.yaml is a template with <placeholders> for
                  # the parts only the operator knows. Deploying it unfilled
                  # produces an ImagePullBackOff or an unresolvable DB host, so
                  # refuse here instead of shipping a broken release.
                  if grep -qE '<[a-z0-9-]+>' "$VALUES_FILE"; then
                      placeholders=$(grep -oE '<[a-z0-9-]+>' "$VALUES_FILE" | sort -u | tr '\n' ' ')
                      echo "::warning::$VALUES_FILE still contains placeholders: $placeholders"
                      echo "::warning::They must be overridden by this workflow (image repository, DB host) or filled in by hand."
                  fi

                  [ "$missing" -eq 0 ] || exit 1
                  echo "Deploy role, domain, image registry, AWS region, EKS cluster and DB host are configured."

            # ------------------------------------------------------------------
            # Resolve the exact image this commit built.
            #
            # docker-push.yml tags the Odoo image with ${{ github.sha }}. The
            # workflow must deploy THAT tag — a Helm chart pinned to a literal
            # tag in a values file would deploy whatever was pinned last, and
            # values.production.yaml only carries a <account>/prod-<sha>
            # placeholder, which resolves to a non-existent image.
            # ------------------------------------------------------------------
            - name: Resolve image reference
              id: image
              env:
                  IMAGE_REPO_VAR: ${{ vars.ODOO_IMAGE_REPOSITORY }}
                  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
              run: |
                  set -euo pipefail
                  REPO="${IMAGE_REPO_VAR:-}"
                  if [ -z "$REPO" ]; then
                      REPO="${DOCKERHUB_USER,,}/odoo"
                  fi
                  # Immutable tag per commit: the same tag docker-push.yml
                  # pushed, so a rollback can name an exact artifact too.
                  TAG="${GITHUB_SHA}"
                  echo "repo=$REPO" >> "$GITHUB_OUTPUT"
                  echo "tag=$TAG" >> "$GITHUB_OUTPUT"
                  echo "ref=$REPO:$TAG" >> "$GITHUB_OUTPUT"
                  echo "Image: $REPO:$TAG"

            # ------------------------------------------------------------------
            # Chart gate — lint and render BEFORE touching production.
            #
            # helm upgrade would also fail on a broken template, but by then the
            # release is already being mutated (or the namespace created).
            # Catching it here keeps the failure cheap and the message readable.
            # ------------------------------------------------------------------
            - name: Set up Helm
              uses: azure/setup-helm@v4
              with:
                  version: v3.16.4

            - name: helm lint
              run: helm lint "$CHART" -f "$VALUES_FILE"

            - name: helm template (render check)
              env:
                  # Rendered with the real DB host, so the preflight step below
                  # inspects exactly the manifest this deploy will apply. Named
                  # SECRET_DB_HOST, not DB_HOST: the authoritative DB_HOST is
                  # the one published below, read back out of the render.
                  SECRET_DB_HOST: ${{ secrets.ODOO_DB_HOST }}
              run: |
                  set -euo pipefail
                  helm template "$RELEASE" "$CHART" -f "$VALUES_FILE" \
                    --set odoo.image.repository="${{ steps.image.outputs.repo }}" \
                    --set odoo.image.tag="${{ steps.image.outputs.tag }}" \
                    --set-string "config.odooDbHost=$SECRET_DB_HOST" \
                    > rendered.yaml
                  echo "Rendered $(grep -c '^kind:' rendered.yaml || true) objects:"
                  grep '^kind:' rendered.yaml | sort | uniq -c || true

                  # Read the DB host back out of the rendered ConfigMap - the
                  # object that actually feeds Odoo's HOST env var - and publish
                  # it to every later step through $GITHUB_ENV. One value, one
                  # source: the preflight Job, the prerequisite report and helm
                  # itself then cannot disagree, and no step can inherit an
                  # undefined DB_HOST (which under `set -u` aborts the run with
                  # the unhelpful "DB_HOST: unbound variable").
                  #
                  # The read is NOT `grep | sed -E 's/..."([^"]*)".../\1/'`:
                  # sed implementations disagree about what `\1` means in a
                  # replacement, and at least one expands it to the octal escape
                  # 0x01 - the value published to $GITHUB_ENV would then be a
                  # single control byte instead of a host, and the deploy would
                  # fail looking for a database called "\x01". The parser below
                  # has one meaning everywhere.
                  RENDERED_DB_HOST=$(python3 infra/k8s/rendered_config.py \
                    rendered.yaml ConfigMap data.ODOO_DB_HOST || true)
                  if [ -z "$RENDERED_DB_HOST" ]; then
                      echo "::error::The rendered ConfigMap carries no ODOO_DB_HOST."
                      exit 1
                  fi
                  case "$RENDERED_DB_HOST" in
                      *"<"* | *">"*)
                          echo "::error::Rendered ODOO_DB_HOST is still a placeholder: $RENDERED_DB_HOST"
                          echo "::error::Set the ODOO_DB_HOST secret to the RDS endpoint (terraform output rds_hostname)."
                          exit 1
                          ;;
                  esac
                  echo "Rendered DB host: $RENDERED_DB_HOST"
                  echo "DB_HOST=$RENDERED_DB_HOST" >> "$GITHUB_ENV"

            # ------------------------------------------------------------------
            # OIDC → AWS. The role's trust policy allows this repo + environment
            # to assume it, so no AWS_ACCESS_KEY_ID / SECRET are stored.
            # ------------------------------------------------------------------
            - name: Configure AWS credentials (OIDC)
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-region: ${{ env.AWS_REGION }}
                  role-to-assume: ${{ secrets.AWS_EKS_DEPLOY_ROLE_ARN }}

            - name: Update kubeconfig
              run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

            # ------------------------------------------------------------------
            # Prove the cluster accepts this identity BEFORE the deploy spends
            # anything on it.
            #
            # Being able to assume the deploy role is not the same as being a
            # cluster identity. EKS authenticates with an aws-auth ConfigMap (or
            # API access entries, on clusters created with
            # authentication_mode=API_AND_CONFIG_MAP): a role that is not mapped
            # there gets a bare
            #
            #   error: unable to recognize "STDIN": the server has asked for
            #   the client to provide credentials
            #
            # from the first kubectl call, which explains nothing and arrives
            # after the 15-minute image wait. This step turns that into an
            # immediate failure that names the missing mapping and how to add it.
            # ------------------------------------------------------------------
            - name: Verify cluster access
              run: |
                  set -euo pipefail
                  CALLER_ARN=$(aws sts get-caller-identity --query Arn --output text 2>/dev/null || true)
                  if [ -z "$CALLER_ARN" ]; then
                      echo "::error::aws sts get-caller-identity failed: the workflow's AWS credentials are not usable."
                      echo "::error::Check secrets.AWS_EKS_DEPLOY_ROLE_ARN and the OIDC trust policy for this repo + environment."
                      exit 1
                  fi
                  echo "AWS identity: $CALLER_ARN"
                  echo "Cluster:      $EKS_CLUSTER ($AWS_REGION)"

                  # A cluster-scoped read is the cheapest proof that the API
                  # server accepted the token. It is deliberately not `kubectl
                  # version` or /readyz: those answer without authenticating.
                  set +e
                  READ_ERROR=$(kubectl get namespace "$NAMESPACE" \
                    --request-timeout=20s 2>&1)
                  READ_STATUS=$?
                  set -e

                  if [ "$READ_STATUS" -eq 0 ]; then
                      echo "EKS accepted $CALLER_ARN (namespace $NAMESPACE is readable)."
                      exit 0
                  fi

                  case "$READ_ERROR" in
                      *"provide credentials"* | *Unauthorized* | *"must be logged in"* | *"getting credentials"*)
                          echo "::error::EKS rejected $CALLER_ARN: the role is not mapped into cluster $EKS_CLUSTER."
                          echo "::error::authenticated=false - the API server answered 401, the token itself was refused."
                          echo "::error::Grant the deploy role access from an admin context (one time, per cluster):"
                          echo "::error::  aws eks create-access-entry --cluster-name $EKS_CLUSTER --region $AWS_REGION \\"
                          echo "::error::    --principal-arn $CALLER_ARN --type STANDARD"
                          echo "::error::  aws eks associate-access-policy --cluster-name $EKS_CLUSTER --region $AWS_REGION \\"
                          echo "::error::    --principal-arn $CALLER_ARN --access-scope type=cluster \\"
                          echo "::error::    --policy-arn arn:aws:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
                          echo "::error::On a cluster whose aws-auth ConfigMap is still authoritative use:"
                          echo "::error::  eksctl create iamidentitymapping --cluster $EKS_CLUSTER --region $AWS_REGION \\"
                          echo "::error::    --arn $CALLER_ARN --group system:masters --username github-deploy"
                          echo "::error::See infra/runbook.md section 1."
                          exit 1
                          ;;
                      *Forbidden* | *"cannot get resource"*)
                          echo "::error::EKS accepted $CALLER_ARN but its RBAC denies reading namespaces in $NAMESPACE."
                          echo "::error::authenticated=true, authorized=false - the cluster identity needs a role that can manage the release."
                          echo "::error::attached access policy must be AmazonEKSClusterAdminPolicy (or equivalent) - see infra/runbook.md section 1."
                          exit 1
                          ;;
                      *NotFound* | *"not found"*)
                          # Authenticated, no such namespace yet. helm creates it.
                          echo "EKS accepted $CALLER_ARN (namespace $NAMESPACE does not exist yet; the release will create it)."
                          ;;
                      *)
                          echo "::error::kubectl cannot read cluster $EKS_CLUSTER as $CALLER_ARN:"
                          echo "::error::$READ_ERROR"
                          echo "::error::Check that the cluster exists in $AWS_REGION and that kubeconfig was written by the step above."
                          exit 1
                          ;;
                  esac

            # ------------------------------------------------------------------
            # Wait for the image to exist.
            #
            # The image build (docker-push.yml) runs on the same push, in
            # parallel — there is no dependency between the two workflows. A
            # deploy that starts first would leave pods in ImagePullBackOff and
            # then roll back for a reason that resolves itself a minute later.
            # ------------------------------------------------------------------
            - name: Wait for the built image to be available
              env:
                  IMAGE_REF: ${{ steps.image.outputs.ref }}
              run: |
                  set -euo pipefail
                  if [[ "$IMAGE_REF" == *.dkr.ecr.* ]]; then
                      REGISTRY="${IMAGE_REF%%/*}"
                      aws ecr get-login-password --region "$AWS_REGION" \
                        | docker login --username AWS --password-stdin "$REGISTRY"
                  elif [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
                      echo "${{ secrets.DOCKERHUB_TOKEN }}" \
                        | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
                  fi

                  deadline=$(( $(date +%s) + IMAGE_WAIT_SECONDS ))
                  until docker manifest inspect "$IMAGE_REF" >/dev/null 2>&1; do
                      if [ "$(date +%s)" -ge "$deadline" ]; then
                          echo "::error::Image $IMAGE_REF did not appear within ${IMAGE_WAIT_SECONDS}s."
                          echo "::error::Check the docker-push.yml run for this commit: $GITHUB_SHA"
                          exit 1
                      fi
                      echo "Waiting for $IMAGE_REF ..."
                      sleep 15
                  done
                  echo "Image is available: $IMAGE_REF"

            # ------------------------------------------------------------------
            # Cluster prerequisites that helm cannot verify, because the chart
            # references them instead of creating them.
            #
            # Every value below is read out of rendered.yaml - the exact manifest
            # about to be applied - so these checks cannot drift from the chart.
            # ------------------------------------------------------------------
            - name: Check cluster prerequisites
              # DB_HOST arrives from $GITHUB_ENV, published by the render step
              # above out of rendered.yaml. It is deliberately NOT a step-level
              # env: `env:` wins over $GITHUB_ENV, so a locally declared copy
              # would silently be a second source of truth for the same value.
              run: |
                  set -euo pipefail
                  kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml \
                    | kubectl apply --validate=false -f -

                  SECRET=$(awk '/secretKeyRef:/{f=1} f && /name:/{print $2; exit}' rendered.yaml)
                  KEY=$(awk '/secretKeyRef:/{f=1} f && /key:/{print $2; exit}' rendered.yaml)
                  # Same reader as the render step: reading a rendered value is
                  # a parse, not a text substitution, and sed's replacement
                  # syntax is not portable (see the render step for the 0x01
                  # that `\1` produced).
                  DB_PORT=$(python3 infra/k8s/rendered_config.py \
                    rendered.yaml ConfigMap data.ODOO_DB_PORT || true)
                  DB_USER=$(python3 infra/k8s/rendered_config.py \
                    rendered.yaml ConfigMap data.ODOO_DB_USER || true)
                  DB_NAME=$(grep -m1 -oE '\-\-database=[A-Za-z0-9_]+' rendered.yaml \
                    | head -1 | cut -d= -f2 || true)
                  # The PVC omits storageClassName entirely when the values file
                  # leaves it empty (cluster default), so "no match" is a valid
                  # answer here, not an error - hence the `|| true`.
                  STORAGE_CLASS=$(python3 infra/k8s/rendered_config.py \
                    rendered.yaml PersistentVolumeClaim spec.storageClassName || true)

                  if [ -z "${DB_HOST:-}" ]; then
                      echo "::error::DB_HOST was not published by the render step - refusing to guess a database target."
                      exit 1
                  fi

                  echo "DB target: $DB_USER@$DB_HOST:$DB_PORT/$DB_NAME"
                  echo "DB Secret: $SECRET (key $KEY)"
                  echo "Filestore StorageClass: ${STORAGE_CLASS:-cluster-default}"

                  if [ -z "$SECRET" ] || [ -z "$KEY" ]; then
                      echo "::error::Could not read the DB Secret reference from the rendered manifest."
                      exit 1
                  fi
                  {
                      echo "DB_SECRET_NAME=$SECRET"
                      echo "DB_SECRET_KEY=$KEY"
                      echo "DB_PORT=${DB_PORT:-5432}"
                      echo "DB_USER=${DB_USER:-odoo}"
                      echo "DB_NAME=${DB_NAME:-odoo}"
                  } >> "$GITHUB_ENV"

                  # A missing Secret never fails at template time: it makes every
                  # pod stick in CreateContainerConfigError until the wait budget
                  # expires - the "context deadline exceeded" that used to be the
                  # only information this pipeline produced.
                  if ! kubectl get secret "$SECRET" -n "$NAMESPACE" 2>/dev/null 1>&2; then
                      echo "::error::Secret $SECRET does not exist in namespace $NAMESPACE."
                      echo "::error::External Secrets should create it (ExternalSecret to Secret). Current state:"
                      kubectl get externalsecret -n "$NAMESPACE" || true
                      kubectl get secret -n "$NAMESPACE" || true
                      exit 1
                  fi
                  if [ -z "$(kubectl get secret "$SECRET" -n "$NAMESPACE" \
                      -o jsonpath="{.data.$KEY}")" ]; then
                      echo "::error::Secret $SECRET exists but has no non-empty $KEY key."
                      kubectl get secret "$SECRET" -n "$NAMESPACE" -o jsonpath='{.data}' \
                        | python3 -c 'import json,sys; print("keys:", sorted(json.load(sys.stdin)))' || true
                      exit 1
                  fi
                  echo "Secret $SECRET has a non-empty $KEY."

                  # An unbound PVC means the pod never schedules, and the only
                  # symptom after twelve minutes is the wait timeout.
                  if [ -n "$STORAGE_CLASS" ] && ! kubectl get storageclass "$STORAGE_CLASS" 2>/dev/null 1>&2; then
                      echo "::error::StorageClass $STORAGE_CLASS (referenced by the filestore PVC) does not exist."
                      echo "::error::Install the aws-efs-csi-driver addon and create that class from an EFS filesystem"
                      echo "::error::in the node VPC, or point odoo.filestore.storageClassName at a class the cluster has."
                      kubectl get storageclass || true
                      exit 1
                  fi
                  echo "Cluster prerequisites OK."

            # ------------------------------------------------------------------
            # Prove the database is reachable and initialised, from inside the
            # cluster, before the release is touched.
            #
            # Odoo's readiness probe only proves the DB *port* answers: it dials
            # the "postgres" maintenance database, which RDS always ships, so it
            # says nothing about the "odoo" database existing or carrying a
            # schema. Both failures still surface as "pods never ready" twelve
            # minutes later. This Job walks the same Secret, endpoint and
            # security-group path Odoo will use and answers in about 30 seconds.
            # ------------------------------------------------------------------
            - name: Preflight database check
              # DB_HOST, DB_PORT, DB_USER, DB_NAME, DB_SECRET_NAME and
              # DB_SECRET_KEY all come from $GITHUB_ENV (published by the two
              # steps above, out of rendered.yaml), so this Job walks exactly
              # the endpoint and credentials the chart is about to deploy.
              env:
                  IMAGE_REF: ${{ steps.image.outputs.ref }}
                  JOB_NAME: odoo-db-preflight-${{ github.run_id }}
              run: |
                  set -euo pipefail
                  command -v envsubst 2>/dev/null 1>&2 \
                    || { echo "::error::envsubst is missing (package gettext)."; exit 1; }

                  # envsubst without a variable list substitutes *every*
                  # ${...} it finds and leaves nothing behind to notice a
                  # missing one: an unset DB_HOST would render
                  # `value: ""` and the Job would fail against a blank host
                  # instead of here. Check the whole set first.
                  for required in DB_HOST DB_PORT DB_USER DB_NAME \
                                  DB_SECRET_NAME DB_SECRET_KEY NAMESPACE IMAGE_REF; do
                      if [ -z "${!required:-}" ]; then
                          echo "::error::$required is empty - refusing to render a preflight Job with a blank field."
                          exit 1
                      fi
                  done

                  kubectl delete job "$JOB_NAME" -n "$NAMESPACE" --ignore-not-found
                  envsubst < infra/k8s/odoo-db-preflight-job.yaml | kubectl apply -f -

                  if ! kubectl wait --for=condition=complete "job/$JOB_NAME" \
                      -n "$NAMESPACE" --timeout=180s; then
                      echo "::error::The database preflight did not complete. Its log says why:"
                      kubectl logs "job/$JOB_NAME" -n "$NAMESPACE" || true
                      kubectl describe "job/$JOB_NAME" -n "$NAMESPACE" || true
                      exit 1
                  fi
                  kubectl logs "job/$JOB_NAME" -n "$NAMESPACE"

            # ------------------------------------------------------------------
            # Record the current revision so a failed smoke test can roll back.
            #
            # 'prev' is always a number, and 0 means "nothing to roll back to".
            # A release with a single revision has no previous one: rolling
            # back to the revision that is already live would report success
            # without changing anything, which is worse than failing loudly.
            # ------------------------------------------------------------------
            - name: Capture previous helm revision
              id: revision
              run: |
                  set -euo pipefail
                  # Pick the newest revision that is DEPLOYED, not simply the
                  # newest one. After a failed upgrade the newest revision has
                  # status "failed" (or "uninstalled" after the revert below), and
                  # rolling back to it would re-apply the chart that just failed.
                  PREV=0
                  if helm history "$RELEASE" -n "$NAMESPACE" >/dev/null 2>&1; then
                      PREV=$(helm history "$RELEASE" -n "$NAMESPACE" -o json \
                        | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin) if x.get("status") == "deployed"]; print(r[-1]["revision"] if r else 0)' \
                        2>/dev/null || echo 0)
                  fi
                  case "$PREV" in
                      ''|*[!0-9]*) PREV=0 ;;
                  esac
                  echo "prev=$PREV" >> "$GITHUB_OUTPUT"
                  if [ "$PREV" = "0" ]; then
                      echo "No previous revision to roll back to (first deploy, or only one revision exists)."
                  else
                      echo "Previous revision: $PREV"
                  fi

            # ------------------------------------------------------------------
            # THE DEPLOY — one helm upgrade --install.
            #
            # No --atomic: see the header. --wait blocks until every object in
            # the release reports ready and honours --timeout, so a broken
            # release is detected at the same moment --atomic would have detected
            # it. The difference is what happens next: the pods survive long
            # enough for the diagnostics step below to explain the failure, and
            # the revert step then restores the previous state.
            # ------------------------------------------------------------------
            - name: helm upgrade --install
              id: release
              run: |
                  set -euo pipefail
                  # DB host comes from $GITHUB_ENV (rendered.yaml -> ConfigMap),
                  # the same value the preflight Job just proved reachable, so
                  # what is checked and what is deployed are the same endpoint.
                  if [ -z "${DB_HOST:-}" ]; then
                      echo "::error::DB_HOST is empty - the chart would fall back to an in-cluster Postgres Service that production does not deploy."
                      exit 1
                  fi
                  SET_ARGS=(
                    --set "odoo.image.repository=${{ steps.image.outputs.repo }}"
                    --set "odoo.image.tag=${{ steps.image.outputs.tag }}"
                    --set-string "config.odooDbHost=${DB_HOST}"
                  )

                  helm upgrade --install "$RELEASE" "$CHART" \
                    -f "$VALUES_FILE" \
                    -n "$NAMESPACE" --create-namespace \
                    "${SET_ARGS[@]}" \
                    --description "deploy ${GITHUB_SHA}" \
                    --wait --timeout "$HELM_TIMEOUT"

            # ------------------------------------------------------------------
            # WHY THE RELEASE DID NOT CONVERGE.
            #
            # Everything --atomic would have deleted, printed while it still
            # exists: pod phases and restart counts, container states (image
            # pull errors, OOMKilled, CreateContainerConfigError from a missing
            # Secret), scheduler events (unschedulable PVC, insufficient
            # memory), and the last logs of each Odoo container.
            # ------------------------------------------------------------------
            - name: Collect failure diagnostics
              if: failure()
              run: |
                  {
                    echo "### helm status"
                    helm status "$RELEASE" -n "$NAMESPACE" || true
                    echo "### helm history"
                    helm history "$RELEASE" -n "$NAMESPACE" --max 5 || true
                    echo "### pods"
                    kubectl get pods -n "$NAMESPACE" -o wide || true
                    echo "### persistent volume claims"
                    kubectl get pvc -n "$NAMESPACE" || true
                    echo "### storage classes"
                    kubectl get storageclass || true
                    echo "### events (oldest first)"
                    kubectl get events -n "$NAMESPACE" --sort-by=.lastTimestamp || true
                    echo "### deployment"
                    kubectl describe deployment -n "$NAMESPACE" \
                      -l "app.kubernetes.io/instance=$RELEASE" || true
                    echo "### pod details"
                    kubectl describe pods -n "$NAMESPACE" \
                      -l "app.kubernetes.io/instance=$RELEASE" || true
                    echo "### odoo logs (current container)"
                    kubectl logs -n "$NAMESPACE" \
                      -l "app.kubernetes.io/instance=$RELEASE,app.kubernetes.io/component=odoo" \
                      --all-containers --tail=300 --prefix || true
                    echo "### odoo logs (previous container: crash loop or OOMKill)"
                    kubectl logs -n "$NAMESPACE" \
                      -l "app.kubernetes.io/instance=$RELEASE,app.kubernetes.io/component=odoo" \
                      --all-containers --tail=300 --prefix --previous || true
                  } 2>&1 | tee deploy-diagnostics.txt

            - name: Upload failure diagnostics
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: deploy-diagnostics
                  path: deploy-diagnostics.txt
                  retention-days: 14
                  if-no-files-found: ignore

            # ------------------------------------------------------------------
            # Keep production consistent when the wait expired.
            #
            # Two situations, two actions:
            #   * a previous revision exists -> roll back to it. It is known
            #     good: it was serving traffic before this run started.
            #   * nothing to roll back to (this run created the release) ->
            #     uninstall, leaving the cluster exactly as it was found.
            #
            # The filestore PVC carries helm.sh/resource-policy: keep, so the
            # attachments survive that uninstall.
            # ------------------------------------------------------------------
            - name: Revert the failed release
              if: ${{ failure() && steps.release.outcome == 'failure' }}
              run: |
                  set -euo pipefail
                  PREV="${{ steps.revision.outputs.prev }}"
                  if [ -n "$PREV" ] && [ "$PREV" != "0" ]; then
                      echo "Deploy failed — rolling back to revision $PREV"
                      helm rollback "$RELEASE" "$PREV" -n "$NAMESPACE" --timeout 5m
                      echo "Rolled back to revision $PREV."
                  else
                      echo "Deploy failed and no previous revision exists — uninstalling the failed release."
                      helm uninstall "$RELEASE" -n "$NAMESPACE" || true
                  fi

            # ------------------------------------------------------------------
            # In-cluster assertion that the rollout completed. --wait already
            # blocked until the Deployment reported ready; this re-checks it
            # against the API server and fails loudly if it regressed between
            # the two calls.
            #
            # The Deployment name is NOT `${RELEASE}-odoo`: odoo-stack.fullname
            # in templates/_helpers.tpl only collapses to the release name when
            # the release name *contains* the chart name, so release 'odoo' +
            # chart 'odoo-stack' renders 'odoo-odoo-stack-odoo'. Resolving it by
            # label keeps this correct whatever the helper does next.
            # ------------------------------------------------------------------
            - name: Verify Odoo rollout
              run: |
                  set -euo pipefail
                  DEPLOY=$(kubectl get deployment -n "$NAMESPACE" \
                    -l "app.kubernetes.io/instance=$RELEASE,app.kubernetes.io/component=odoo" \
                    -o jsonpath='{.items[0].metadata.name}')
                  echo "Waiting for deployment/$DEPLOY"
                  kubectl rollout status "deployment/$DEPLOY" -n "$NAMESPACE" --timeout=5m

            - name: Show deployed revision
              if: always()
              run: |
                  helm list -n "$NAMESPACE" || true
                  helm history "$RELEASE" -n "$NAMESPACE" --max 3 || true

            # ------------------------------------------------------------------
            # Post-deploy smoke test against the public endpoint.
            #
            # Deliberately not scripts/smoke-test.sh: that one is written for the
            # local docker-compose topology (invoice-ai / RabbitMQ / Prometheus
            # on localhost), none of which exist in the cluster or on a runner.
            # ------------------------------------------------------------------
            - name: Smoke test
              id: smoke
              run: |
                  set -e
                  chmod +x scripts/smoke-test-eks.sh
                  ./scripts/smoke-test-eks.sh "${{ secrets.DOMAIN }}"

            # ------------------------------------------------------------------
            # AUTOMATIC ROLLBACK — only when the smoke test itself failed.
            #
            # Gating on steps.smoke.outcome == 'failure' matters: an earlier
            # condition also fired when a preceding step failed (e.g. AWS auth),
            # then ran 'helm rollback' with an empty revision:
            #   could not convert revision to a number: strconv.Atoi: parsing ""
            #
            # The 5-minute timeout matches the rollback bar that was proven on
            # the old EC2 path: past that, DNS has to be flipped by hand and the
            # runbook's manual procedure takes over.
            # ------------------------------------------------------------------
            - name: Roll back on smoke failure
              if: ${{ always() && steps.smoke.outcome == 'failure' }}
              run: |
                  PREV="${{ steps.revision.outputs.prev }}"
                  if [ -z "$PREV" ] || [ "$PREV" = "0" ]; then
                      echo "::error::Smoke test failed and there is no previous revision to roll back to — manual intervention required."
                      echo "::error::See infra/runbook.md §3 'Rollback' for the manual procedure."
                      exit 1
                  fi
                  echo "Smoke test failed — rolling back to revision $PREV"
                  helm rollback "$RELEASE" "$PREV" -n "$NAMESPACE" --timeout 5m
                  # Prove the rollback itself landed, rather than assuming it.
                  DEPLOY=$(kubectl get deployment -n "$NAMESPACE" \
                    -l "app.kubernetes.io/instance=$RELEASE,app.kubernetes.io/component=odoo" \
                    -o jsonpath='{.items[0].metadata.name}')
                  kubectl rollout status "deployment/$DEPLOY" -n "$NAMESPACE" --timeout=5m
                  echo "Rolled back to revision $PREV and deployment/$DEPLOY is available again."
