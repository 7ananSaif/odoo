name: "Release invoice-ai"

"on":
    push:
        tags:
            - "v*"
        paths:
            - "invoice-ai/**"

permissions:
    contents: read
    packages: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Docker image references MUST be lowercase — GitHub owner names
            # like "7ananSaif" are invalid in a registry path and buildx
            # rejects them ("repository name must be lowercase"). Bash's ${,,}
            # expansion lowercases GITHUB_REPOSITORY_OWNER.
            - name: Compute lowercase image name
              run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/invoice-ai" >> "$GITHUB_ENV"

            - name: Set up BuildKit cache
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push release tags
              uses: docker/build-push-action@v6
              with:
                  context: invoice-ai
                  push: true
                  build-args: |
                      INVOICE_AI_BUILD_SHA=${{ github.sha }}
                  tags: |
                      ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
                      ${{ env.IMAGE_NAME }}:${{ github.sha }}
                      ${{ env.IMAGE_NAME }}:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Confirm digest landed in the registry
              run: |
                  docker buildx imagetools inspect \
                      "${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
