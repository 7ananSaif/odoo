# The Secret the production chart references but does not create.
#
# values.production.yaml sets
#   secret.existingSecret: true
#   secret.name: odoo-production-secrets
# so the chart renders no Secret of its own and every pod mounts this one. If it
# is missing, pods never start: they sit in CreateContainerConfigError until the
# helm wait budget expires. That is why the deploy's "Check cluster
# prerequisites" step refuses to run before this object exists and has synced.
#
# The remote secret is a single JSON document so rotation is one call:
#   aws secretsmanager put-secret-value --secret-id odoo/production \
#     --secret-string '{"ODOO_DB_PASSWORD":"<new>","POSTGRES_PASSWORD":"<new>"}'
# The operator refreshes within refreshInterval.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: odoo-production-secrets
  namespace: odoo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    # Must equal secret.name in values.production.yaml. `Owner` makes the
    # operator delete the Secret when this ExternalSecret is removed, instead
    # of leaving an orphan holding a stale password.
    name: odoo-production-secrets
    creationPolicy: Owner
  data:
    # ODOO_DB_PASSWORD is the key the chart's odoo container reads
    # (odoo-deployment.yaml -> secretKeyRef key: ODOO_DB_PASSWORD).
    - secretKey: ODOO_DB_PASSWORD
      remoteRef:
        key: odoo/production
        property: ODOO_DB_PASSWORD
    # POSTGRES_PASSWORD is read by the in-cluster Postgres StatefulSet, which
    # production disables (RDS is the database) but staging/local chart values
    # still use. Keeping it here means one ExternalSecret serves both shapes.
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: odoo/production
        property: POSTGRES_PASSWORD
